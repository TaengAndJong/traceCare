spring:
  application:
    name: tracecare-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
      naming:
        # docs/db/tracecare_schema_ddl_1.0.sql가 모든 테이블/컬럼을 대소문자 혼용 인용 식별자("User" 등)로
        # 정의하므로, Spring Boot 기본 물리 네이밍 전략(자동 snake_case 소문자 변환)을 끄고 Entity에 적은
        # 이름을 그대로 사용한다. globally_quoted_identifiers와 함께 적용해야 케이스가 보존된 채로 인용된다.
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: false
    properties:
      hibernate:
        globally_quoted_identifiers: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:1800000}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:1209600000}

google:
  client-id: ${GOOGLE_CLIENT_ID}

gemini:
  api-key: ${GEMINI_API_KEY}

guardian:
  # DATABASE_DESIGN_GUIDE.md §13/§14 확정: 하드 상한 없음, 애플리케이션 소프트 상한(설정값 관리)
  care-target-limit: ${GUARDIAN_CARE_TARGET_LIMIT:10}

place:
  # DATABASE_DESIGN_GUIDE.md §13/§14 확정: 하드 상한 없음, 애플리케이션 소프트 상한(설정값 관리)
  care-target-limit: ${PLACE_CARE_TARGET_LIMIT:15}
  # 중복 등록 판정 반경(m) — Haversine 실거리 기준, GPS 오차를 고려해 정확히 같은 좌표가 아니어도 중복으로 판단(2026-08 확정)
  duplicate-distance-meters: ${PLACE_DUPLICATE_DISTANCE_METERS:50}

server:
  port: ${SERVER_PORT:8080}
